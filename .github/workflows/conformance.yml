name: External conformance

on:
  workflow_dispatch:
    inputs:
      suite:
        description: Pinned external suite or phase-six process qualification
        required: true
        default: all
        type: choice
        options:
          - all
          - h2spec
          - autobahn
          - tlsfuzzer
          - httpwookiee
          - discovery-qualification
      qualification_duration:
        description: DNS qualification steady-state duration (at least 10m for acceptance)
        required: false
        default: 10m
        type: string
      qualification_concurrency:
        description: Bounded concurrent load workers
        required: false
        default: 8
        type: number
      qualification_seed:
        description: Reproducible workload seed
        required: false
        default: '600601'
        type: string

permissions:
  contents: read

jobs:
  conformance:
    if: inputs.suite != 'discovery-qualification'
    name: Conformance (${{ matrix.suite }})
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        suite: ${{ fromJSON(inputs.suite == 'all' && '["h2spec","autobahn","tlsfuzzer","httpwookiee"]' || format('["{0}"]', inputs.suite)) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: stable
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        if: matrix.suite == 'h2spec'
        with:
          go-version: 1.24.6
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: 3.12.11
      - name: Record tested revision
        run: |
          mkdir -p conformance-results
          git rev-parse HEAD > conformance-results/commit.txt
          printf '%s\n' '${{ matrix.suite }}' > conformance-results/suite.txt
          {
            uname -a
            rustc -Vv
            cargo -V
            python3 --version
            docker version --format '{{json .Server}}' || true
            go version || true
          } > conformance-results/environment.txt 2>&1
      - name: Fetch and verify pinned tools
        run: tools/conformance/fetch.sh "$RUNNER_TEMP/oxidase-conformance-tools"
      - name: Preserve source checksums
        run: |
          cp "$RUNNER_TEMP/oxidase-conformance-tools/downloads/"* conformance-results/
          sha256sum conformance-results/*.tar.gz conformance-results/*.whl \
            > conformance-results/sources.sha256
      - name: Build Oxidase fixture
        run: cargo build --workspace --release --locked
      - name: Start loopback fixture
        run: |
          target/release/oxidase serve tools/conformance/fixture/oxidase.yaml \
            >conformance-results/oxidase.log 2>&1 &
          echo "$!" > conformance-results/oxidase.pid
          python3 tools/conformance/wait-for-ports.py 18080 18081 18443
      - name: Run h2spec
        if: matrix.suite == 'h2spec'
        run: tools/conformance/run-h2spec.sh "$RUNNER_TEMP/oxidase-conformance-tools" conformance-results
      - name: Run Autobahn WebSocket transport suite
        if: matrix.suite == 'autobahn'
        run: tools/conformance/run-autobahn.sh conformance-results
      - name: Run tlsfuzzer interoperability subset
        if: matrix.suite == 'tlsfuzzer'
        run: tools/conformance/run-tlsfuzzer.sh "$RUNNER_TEMP/oxidase-conformance-tools" conformance-results
      - name: Run HTTPWookiee reverse-proxy corpus
        if: matrix.suite == 'httpwookiee'
        run: tools/conformance/run-httpwookiee.sh "$RUNNER_TEMP/oxidase-conformance-tools" conformance-results
      - name: Stop fixture
        if: always()
        run: |
          if test -f conformance-results/oxidase.pid; then
            kill "$(cat conformance-results/oxidase.pid)" || true
          fi
      - name: Upload raw reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: conformance-${{ matrix.suite }}-${{ github.sha }}
          path: conformance-results/
          if-no-files-found: error

  discovery-qualification:
    if: inputs.suite == 'discovery-qualification'
    name: Phase-six separated-process qualification
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CAMPAIGN_DURATION: ${{ inputs.qualification_duration || '10m' }}
      CAMPAIGN_CONCURRENCY: ${{ inputs.qualification_concurrency || 8 }}
      CAMPAIGN_SEED: ${{ inputs.qualification_seed || '600601' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: stable
      - name: Record exact revision and environment
        run: |
          mkdir -p discovery-results
          git rev-parse HEAD > discovery-results/commit.txt
          git status --porcelain=v1 > discovery-results/dirty.txt
          {
            uname -a
            rustc -Vv
            cargo -V
          } > discovery-results/environment.txt
      - name: Build locked gateway and validation-only process tool
        run: cargo build -p oxidase-cli -p oxidase-soak --release --locked
      - name: DNS TTL churn, health and retry campaign
        run: |
          target/release/oxidase-discovery-soak run \
            --gateway target/release/oxidase --campaign discovery \
            --duration "$CAMPAIGN_DURATION" --concurrency "$CAMPAIGN_CONCURRENCY" \
            --seed "$CAMPAIGN_SEED" --reload-interval 3s --payload-size 32768 \
            --warm-up 30s --cooldown 120s --sample-interval 1s \
            --output discovery-results/discovery \
            > discovery-results/discovery-command.log 2>&1
      - name: H2 gRPC Upgrade, signed Bundle and drain campaign
        if: always()
        run: |
          target/release/oxidase-discovery-soak run \
            --gateway target/release/oxidase --campaign protocol \
            --duration 2m --concurrency 6 --seed 600602 \
            --reload-interval 3s --payload-size 32768 \
            --warm-up 30s --cooldown 120s --sample-interval 1s \
            --output discovery-results/protocol \
            > discovery-results/protocol-command.log 2>&1
      - name: Upload raw PID-scoped qualification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: discovery-qualification-${{ github.sha }}
          path: discovery-results/
          if-no-files-found: error
