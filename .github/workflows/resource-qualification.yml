name: Running resource qualification

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Exact 40-character implementation/tool source commit
        required: true
        type: string
      campaign:
        description: Independent runner for each selected load
        default: both
        required: true
        type: choice
        options: [both, healthy, churn]
      parameters:
        description: Explicit bounded phase/load/sampling parameters (profiling defaults off)
        required: true
        type: string
        default: '{"duration":"60m","warm_up":"3m","recovery_running":"15m","quiet_running":"5m","post_drain":"5m","concurrency":8,"payload_size":32768,"upload_size":1048576,"seed":700201,"scrape_interval_ms":1000,"sample_interval_ms":1000,"formal":true,"profiling":false}'

permissions:
  contents: read

jobs:
  qualification:
    name: Running resources (${{ matrix.campaign }})
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        campaign: ${{ fromJSON(inputs.campaign == 'both' && '["healthy","churn"]' || format('["{0}"]', inputs.campaign)) }}
    env:
      RESOURCE_SOURCE_REF: ${{ inputs.source_ref }}
      RESOURCE_PARAMETERS: ${{ inputs.parameters }}
      RESOURCE_CAMPAIGN: ${{ matrix.campaign }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.source_ref }}
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: stable
      - name: Freeze source and environment
        run: |
          python3 tools/qualification/run_resource_campaign.py preflight --output "$RUNNER_TEMP/resource-results"
      - name: Locked normal release binaries
        run: cargo build -p oxidase-cli -p oxidase-soak --release --locked
      - name: Independent analyzer adversarial corpus
        run: python3 -m unittest discover -s tools/qualification/tests -p 'test_*.py' -v
      - name: Record exact binaries after build
        run: |
          target/release/oxidase-discovery-soak resource-build-record \
            --gateway target/release/oxidase \
            --output "$RUNNER_TEMP/resource-results/build-record.json"
      - name: Separate-process bounded campaign and independent replay
        if: ${{ !cancelled() }}
        run: python3 tools/qualification/run_resource_campaign.py run --output "$RUNNER_TEMP/resource-results"
      - name: Preserve raw evidence on success, failure or cancellation
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: resource-7a-${{ matrix.campaign }}-${{ inputs.source_ref }}-${{ github.run_id }}
          path: ${{ runner.temp }}/resource-results/
          if-no-files-found: error
          retention-days: 30
