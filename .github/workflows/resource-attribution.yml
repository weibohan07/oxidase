name: Isolated Linux allocation attribution

on:
  workflow_call:
    inputs:
      source_ref:
        required: true
        type: string
      mode:
        default: launch
        required: false
        type: string
      duration_seconds:
        default: '60'
        required: false
        type: string
      concurrency:
        default: '4'
        required: false
        type: string
  workflow_dispatch:
    inputs:
      source_ref:
        description: Exact 40-character source commit; separate from normal H/C qualification
        required: true
        type: string
      mode:
        description: Launch interposition or explicitly unstable runtime attach (no Yama bypass)
        default: launch
        required: true
        type: choice
        options: [launch, attach]
      duration_seconds:
        description: Bounded isolated H1 Proxy/Asset profile, 5..600 seconds
        default: '60'
        required: true
        type: string
      concurrency:
        description: Bounded fixture clients, 1..16
        default: '4'
        required: true
        type: string

permissions:
  contents: read

jobs:
  allocation:
    name: Allocation stack experiment (not normal qualification)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      ATTRIBUTION_SOURCE_REF: ${{ inputs.source_ref }}
      ATTRIBUTION_MODE: ${{ inputs.mode }}
      ATTRIBUTION_DURATION: ${{ inputs.duration_seconds }}
      ATTRIBUTION_CONCURRENCY: ${{ inputs.concurrency }}
      CARGO_PROFILE_RELEASE_DEBUG: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.source_ref }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: stable
      - name: Validate exact source and parameters before network/build
        run: |
          python3 - <<'PY'
          import json, os, pathlib, re, subprocess
          ref = os.environ['ATTRIBUTION_SOURCE_REF']
          assert re.fullmatch(r'[0-9a-f]{40}', ref), 'exact source SHA required'
          assert subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip() == ref
          assert not subprocess.check_output(['git', 'status', '--porcelain=v1'], text=True).strip()
          assert os.environ['ATTRIBUTION_MODE'] in ['launch', 'attach']
          assert 5 <= int(os.environ['ATTRIBUTION_DURATION']) <= 600
          assert 1 <= int(os.environ['ATTRIBUTION_CONCURRENCY']) <= 16
          root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'attribution-results'
          root.mkdir(exist_ok=False)
          target = str(pathlib.Path(os.environ['RUNNER_TEMP']) / 'attribution-target')
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              env.write('CARGO_TARGET_DIR=' + target + '\n')
          (root / 'source.json').write_text(json.dumps({'source_commit':ref,'run_id':os.environ['GITHUB_RUN_ID'],
              'profiling':True,'normal_release_qualification':False,'build_profile':'release with debug info',
              'rustc':subprocess.check_output(['rustc','-Vv'], text=True),
              'cargo':subprocess.check_output(['cargo','-V'], text=True),
              'build_flags':{k:os.environ.get(k) for k in ['RUSTFLAGS','CARGO_ENCODED_RUSTFLAGS',
                  'CARGO_PROFILE_RELEASE_DEBUG']} | {'CARGO_TARGET_DIR':target},
              'allocator':'unchanged Rust/system allocator'})+'\n')
          PY
      - name: Offline helper boundary regression corpus
        run: python3 -m unittest discover -s tools/qualification/tests -p 'test_probe_resource_attribution.py' -v
      - name: Profiler native prerequisites (never production dependencies)
        continue-on-error: true
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential cmake gdb libboost-dev libboost-system-dev \
            libboost-filesystem-dev libboost-iostreams-dev libboost-program-options-dev libboost-container-dev \
            libunwind-dev libdw-dev zlib1g-dev
      - name: Verify pinned KDE source and build collector/parser without GUI
        continue-on-error: true
        run: |
          python3 tools/qualification/probe_resource_attribution.py prepare \
            --tool-prefix "$RUNNER_TEMP/heaptrack-pinned" \
            --output "$RUNNER_TEMP/attribution-results"
      - name: Separate locked release-with-debug experiment binary
        continue-on-error: true
        run: cargo build -p oxidase-cli --release --locked
      - name: Own gateway identity and bounded collector experiment
        if: ${{ !cancelled() }}
        run: |
          python3 tools/qualification/probe_resource_attribution.py run \
            --gateway "$CARGO_TARGET_DIR/release/oxidase" \
            --tool-prefix "$RUNNER_TEMP/heaptrack-pinned" \
            --output "$RUNNER_TEMP/attribution-results" \
            --mode "$ATTRIBUTION_MODE" \
            --duration "$ATTRIBUTION_DURATION" --concurrency "$ATTRIBUTION_CONCURRENCY"
      - name: Preserve exact source at experiment end
        if: always()
        run: |
          python3 - <<'PY'
          import json, os, pathlib, subprocess
          root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'attribution-results'
          if root.is_dir():
              head = subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
              dirty = subprocess.check_output(['git','status','--porcelain=v1'],text=True).strip()
              result = {'expected_source':os.environ['ATTRIBUTION_SOURCE_REF'],'actual_source':head,
                  'worktree_clean':not dirty,'matched':head == os.environ['ATTRIBUTION_SOURCE_REF'] and not dirty}
              (root / 'source-end.json').write_text(json.dumps(result)+'\n')
              assert result['matched'], 'source changed during experiment'
          PY
      - name: Preserve safe evidence including failed/unavailable measurements
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: allocation-experiment-${{ inputs.mode }}-${{ inputs.source_ref }}-${{ github.run_id }}
          path: ${{ runner.temp }}/attribution-results/
          if-no-files-found: error
          retention-days: 30
