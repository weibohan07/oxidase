name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  msrv:
    name: MSRV 1.88
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: msrv-1.88
      - run: cargo check --workspace --all-targets --all-features --locked
      - run: cargo test --workspace --locked
        env:
          OXIDASE_RESOURCE_TEST_ARTIFACTS: ${{ runner.temp }}/resource-test-evidence
      - run: python3 -m unittest discover -s tools/qualification/tests -p 'test_*.py' -v
      - name: Preserve failed resource implementation smoke
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: resource-smoke-msrv-${{ github.sha }}
          path: ${{ runner.temp }}/resource-test-evidence/
          if-no-files-found: ignore

  workspace:
    name: Stable workspace
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo test --workspace --locked
        env:
          OXIDASE_RESOURCE_TEST_ARTIFACTS: ${{ runner.temp }}/resource-test-evidence
      - run: python3 -m unittest discover -s tools/qualification/tests -p 'test_*.py' -v
      - run: cargo build --workspace --release --locked
      - run: cargo doc --workspace --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings
      - name: Preserve failed resource implementation smoke
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: resource-smoke-stable-${{ github.sha }}
          path: ${{ runner.temp }}/resource-test-evidence/
          if-no-files-found: ignore

  dependency-policy:
    name: Dependency policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  fuzz-compile:
    name: Fuzz harness compile smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            fuzz -> target
          shared-key: fuzz-compile
      - run: cargo check --manifest-path fuzz/Cargo.toml --bins --locked
