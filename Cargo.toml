[workspace]
resolver = "3"
members = [
    "crates/oxidase-cli",
    "crates/oxidase-config",
    "crates/oxidase-core",
    "crates/oxidase-runtime",
    "crates/oxidase-server",
    "crates/oxidase-site",
    "crates/oxidase-source",
    "crates/oxidase-testkit",
]
default-members = ["crates/oxidase-cli"]
exclude = ["fuzz"]

[workspace.package]
version = "0.3.0-alpha.1"
edition = "2024"
license = "MIT"
repository = "https://github.com/weibohan07/oxidase"
rust-version = "1.88"

[workspace.dependencies]
arc-swap = "1.7"
bytes = "1.11.1"
clap = { version = "4", features = ["derive"] }
futures-util = "0.3"
h2 = "0.4"
http = "1"
http-body = "1"
http-body-util = "0.1"
httpdate = "1"
hyper = { version = "1", features = ["client", "http1", "http2", "server"] }
hyper-rustls = { version = "0.27", default-features = false, features = ["http1", "http2", "logging", "native-tokio", "ring", "tls12"] }
hyper-util = { version = "0.1", features = ["client", "client-legacy", "http1", "http2", "server", "tokio"] }
indexmap = { version = "2", features = ["serde"] }
mime_guess = "2"
percent-encoding = "2"
regex = "1"
rustls = { version = "0.23.43", default-features = false, features = ["logging", "ring", "std", "tls12"] }
rustls-native-certs = "0.8"
rustls-pki-types = { version = "1.15.1", features = ["std"] }
rustls-webpki = { version = "0.103.15", default-features = false, features = ["ring", "std"] }
rcgen = { version = "0.14", default-features = false, features = ["pem", "ring"] }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
serde_yaml_ng = "0.10"
sha2 = "0.11"
tempfile = "3"
thiserror = "1"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-rustls = { version = "0.26.4", default-features = false, features = ["logging", "ring", "tls12"] }
tokio-util = { version = "0.7", features = ["io"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
url = "2"
walkdir = "2"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unwrap_used = "warn"
