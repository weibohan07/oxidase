[package]
name = "oxidase-soak"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false
default-run = "oxidase-soak"

[[bin]]
name = "oxidase-discovery-soak"
path = "src/bin/discovery.rs"

[dependencies]
bytes.workspace = true
clap.workspace = true
http.workspace = true
http-body.workspace = true
http-body-util.workspace = true
hickory-resolver.workspace = true
hyper.workspace = true
hyper-util.workspace = true
oxidase-config = { path = "../oxidase-config" }
oxidase-core = { path = "../oxidase-core" }
oxidase-bundle = { path = "../oxidase-bundle" }
oxidase-runtime = { path = "../oxidase-runtime" }
oxidase-server = { path = "../oxidase-server" }
rcgen.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["process", "io-std"] }
tokio-rustls.workspace = true

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["process", "time"] }

[lints]
workspace = true
