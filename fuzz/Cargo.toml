[package]
name = "oxidase-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
http = "1"
libfuzzer-sys = "0.4"
oxidase-bundle = { path = "../crates/oxidase-bundle" }
oxidase-cli = { path = "../crates/oxidase-cli", features = ["fuzzing"] }
oxidase-config = { path = "../crates/oxidase-config" }
oxidase-core = { path = "../crates/oxidase-core" }
oxidase-runtime = { path = "../crates/oxidase-runtime" }
oxidase-server = { path = "../crates/oxidase-server", features = ["fuzzing"] }
oxidase-site = { path = "../crates/oxidase-site" }
serde_json = "1"
tempfile = "3"

[[bin]]
name = "pattern"
path = "fuzz_targets/pattern.rs"
test = false
doc = false
bench = false
[[bin]]
name = "expression"
path = "fuzz_targets/expression.rs"
test = false
doc = false
bench = false

[[bin]]
name = "config"
path = "fuzz_targets/config.rs"
test = false
doc = false
bench = false

[[bin]]
name = "import_graph"
path = "fuzz_targets/import_graph.rs"
test = false
doc = false
bench = false

[[bin]]
name = "oxr_front_matter"
path = "fuzz_targets/oxr_front_matter.rs"
test = false
doc = false
bench = false

[[bin]]
name = "oxt_parser"
path = "fuzz_targets/oxt_parser.rs"
test = false
doc = false
bench = false

[[bin]]
name = "site_path"
path = "fuzz_targets/site_path.rs"
test = false
doc = false
bench = false

[[bin]]
name = "transport_config"
path = "fuzz_targets/transport_config.rs"
test = false
doc = false
bench = false

[[bin]]
name = "cluster_runtime"
path = "fuzz_targets/cluster_runtime.rs"
test = false
doc = false
bench = false

[[bin]]
name = "protocol_boundary"
path = "fuzz_targets/protocol_boundary.rs"
test = false
doc = false
bench = false

[[bin]]
name = "diagnostic_json"
path = "fuzz_targets/diagnostic_json.rs"
test = false
doc = false
bench = false

[[bin]]
